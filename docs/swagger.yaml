basePath: /api/v1
definitions:
  request.ChangePINRequest:
    properties:
      new_pin:
        type: string
      old_pin:
        type: string
    required:
    - new_pin
    - old_pin
    type: object
  request.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 6
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  request.CreateMerchantRequest:
    properties:
      merchant_category:
        maxLength: 100
        type: string
      merchant_city:
        maxLength: 100
        type: string
      merchant_id:
        maxLength: 20
        type: string
      merchant_name:
        maxLength: 200
        type: string
      merchant_status:
        enum:
        - aktif
        - nonaktif
        type: string
      merchant_type:
        enum:
        - offline
        - online
        - hybrid
        type: string
    required:
    - merchant_category
    - merchant_id
    - merchant_name
    - merchant_type
    type: object
  request.CreateTransactionRequest:
    properties:
      account_id:
        type: integer
      amount:
        type: number
      channel:
        enum:
        - mobile
        - QRIS
        - virtual_account
        - transfer
        type: string
      description:
        maxLength: 255
        type: string
      destination_account_number:
        type: string
      destination_bank_code:
        type: string
      destination_name:
        type: string
      merchant_category:
        maxLength: 100
        type: string
      merchant_location:
        maxLength: 200
        type: string
      merchant_name:
        maxLength: 200
        type: string
      note:
        maxLength: 255
        type: string
      pin:
        type: string
      type:
        enum:
        - TRANSFER
        - PAYMENT
        - TOPUP
        - WITHDRAW
        - DEPOSIT
        - QRIS
        type: string
    required:
    - account_id
    - amount
    - pin
    - type
    type: object
  request.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  request.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  request.RegisterRequest:
    properties:
      date_of_birth:
        type: string
      email:
        maxLength: 100
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      occupation:
        maxLength: 100
        type: string
      password:
        maxLength: 100
        minLength: 6
        type: string
      phone:
        maxLength: 15
        minLength: 10
        type: string
    required:
    - email
    - password
    type: object
  request.SetPINRequest:
    properties:
      pin:
        type: string
    required:
    - pin
    type: object
  request.TrackFeatureClickRequest:
    properties:
      feature_name:
        maxLength: 100
        type: string
    required:
    - feature_name
    type: object
  request.UpdateMerchantRequest:
    properties:
      merchant_category:
        maxLength: 100
        type: string
      merchant_city:
        maxLength: 100
        type: string
      merchant_name:
        maxLength: 200
        type: string
      merchant_status:
        enum:
        - aktif
        - nonaktif
        type: string
      merchant_type:
        enum:
        - offline
        - online
        - hybrid
        type: string
    type: object
  request.UpdatePersonalizationRequest:
    properties:
      enabled:
        type: boolean
    type: object
  request.UpdatePhoneRequest:
    properties:
      phone:
        type: string
    required:
    - phone
    type: object
  request.UpdateProfileRequest:
    properties:
      date_of_birth:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      occupation:
        maxLength: 100
        type: string
    type: object
  response.Base:
    properties:
      data: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        type: boolean
    type: object
  response.CategorySpendingResponse:
    properties:
      merchant_category:
        type: string
      total_amount:
        type: number
      transaction_count:
        type: integer
    type: object
  response.FeatureClickResponse:
    properties:
      click_count:
        type: integer
      feature_name:
        type: string
      last_clicked:
        type: string
    type: object
  response.MerchantResponse:
    properties:
      id:
        type: integer
      merchant_category:
        type: string
      merchant_city:
        type: string
      merchant_id:
        type: string
      merchant_name:
        type: string
      merchant_status:
        type: string
      merchant_type:
        type: string
    type: object
  response.MerchantSummaryResponse:
    properties:
      merchant_category:
        type: string
      merchant_name:
        type: string
      total_amount:
        type: number
      transaction_count:
        type: integer
    type: object
  response.Meta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  response.RecommendationReasonResponse:
    properties:
      consent_status:
        type: boolean
      data_used:
        description: e.g. "Riwayat transaksi, Preferensi kategori"
        type: string
      reason:
        type: string
      recommendation_id:
        type: integer
      title:
        type: string
    type: object
  response.RecommendationResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      image_url:
        type: string
      priority:
        type: integer
      reason:
        description: 'explainable: "Karena Anda sering bertransaksi di E-Wallet"'
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  response.SpendingSummaryResponse:
    properties:
      category_breakdown:
        items:
          $ref: '#/definitions/response.CategorySpendingResponse'
        type: array
      fav_category:
        type: string
      fav_method:
        type: string
      top_merchants:
        items:
          $ref: '#/definitions/response.MerchantSummaryResponse'
        type: array
      total_spend:
        type: number
      total_transactions:
        type: integer
      weekly_comparison:
        items:
          $ref: '#/definitions/response.WeeklySpendingResponse'
        type: array
    type: object
  response.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/response.UserResponse'
    type: object
  response.TransactionResponse:
    properties:
      amount:
        type: number
      balance_after:
        type: number
      balance_before:
        type: number
      channel:
        type: string
      created_at:
        type: string
      description:
        type: string
      destination_account_number:
        type: string
      destination_bank_code:
        type: string
      destination_name:
        type: string
      fee:
        type: number
      id:
        type: integer
      is_recommended:
        type: boolean
      merchant_category:
        type: string
      merchant_location:
        type: string
      merchant_name:
        type: string
      note:
        type: string
      recommendation_id:
        type: integer
      reference_number:
        type: string
      status:
        type: string
      transacted_at:
        type: string
      type:
        type: string
    type: object
  response.UserResponse:
    properties:
      created_at:
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      gender:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_personalization_enabled:
        type: boolean
      last_login_at:
        type: string
      marital_status:
        type: string
      monthly_income_range:
        type: string
      name:
        type: string
      occupation:
        type: string
      phone:
        type: string
      segment:
        type: string
    type: object
  response.WeeklySpendingResponse:
    properties:
      category:
        type: string
      current_week_spend:
        type: number
      previous_week_spend:
        type: number
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for MyBank Application
  title: MyBank API
  version: "1.0"
paths:
  /auth/change-pin:
    put:
      consumes:
      - application/json
      description: Change user PIN
      parameters:
      - description: Change PIN Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.ChangePINRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Change PIN
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access & refresh tokens
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Base'
            - properties:
                data:
                  $ref: '#/definitions/response.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
      summary: Login user
      tags:
      - auth
  /auth/password:
    put:
      consumes:
      - application/json
      description: Change user password
      parameters:
      - description: Change Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - auth
  /auth/pin/setup:
    post:
      consumes:
      - application/json
      description: Set user PIN for the first time
      parameters:
      - description: Set PIN Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.SetPINRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Setup PIN
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Get a new access token using a refresh token
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Base'
            - properties:
                data:
                  $ref: '#/definitions/response.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with email and password
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Base'
            - properties:
                data:
                  $ref: '#/definitions/response.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Base'
      summary: Register a new user
      tags:
      - auth
  /features/click:
    post:
      consumes:
      - application/json
      description: Record a user's click on a mobile banking feature
      parameters:
      - description: Feature Click Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.TrackFeatureClickRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Track feature click
      tags:
      - features
  /features/clicks:
    get:
      consumes:
      - application/json
      description: Get a list of all features clicked by the user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Base'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/response.FeatureClickResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Get feature clicks
      tags:
      - features
  /merchants:
    get:
      consumes:
      - application/json
      description: Get a list of all merchants
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Base'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/response.MerchantResponse'
                  type: array
              type: object
      summary: Get all merchants
      tags:
      - merchants
    post:
      consumes:
      - application/json
      description: Create a new merchant entry
      parameters:
      - description: Create Merchant Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.CreateMerchantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Base'
            - properties:
                data:
                  $ref: '#/definitions/response.MerchantResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Create a new merchant
      tags:
      - merchants
  /merchants/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a merchant by ID
      parameters:
      - description: Merchant DB ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Delete a merchant
      tags:
      - merchants
    put:
      consumes:
      - application/json
      description: Update merchant details by ID
      parameters:
      - description: Merchant DB ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update Merchant Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.UpdateMerchantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Base'
            - properties:
                data:
                  $ref: '#/definitions/response.MerchantResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Update a merchant
      tags:
      - merchants
  /merchants/{merchant_id}:
    get:
      consumes:
      - application/json
      description: Get a single merchant by its merchant_id (e.g. M001)
      parameters:
      - description: Merchant ID (e.g. M001)
        in: path
        name: merchant_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Base'
            - properties:
                data:
                  $ref: '#/definitions/response.MerchantResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Base'
      summary: Get merchant by merchant_id
      tags:
      - merchants
  /merchants/category:
    get:
      consumes:
      - application/json
      description: Get all active merchants filtered by category
      parameters:
      - description: Merchant Category (e.g. F&B, Retail)
        in: query
        name: category
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Base'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/response.MerchantResponse'
                  type: array
              type: object
      summary: Get merchants by category
      tags:
      - merchants
  /recommendations:
    get:
      consumes:
      - application/json
      description: Get personalized recommendations for the logged-in user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Base'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/response.RecommendationResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Get user recommendations
      tags:
      - recommendations
  /recommendations/{id}/click:
    post:
      consumes:
      - application/json
      description: Record a click on a specific recommendation
      parameters:
      - description: Recommendation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Base'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Track recommendation click
      tags:
      - recommendations
  /recommendations/{id}/reason:
    get:
      consumes:
      - application/json
      description: Get the reason why a specific recommendation was shown to the user
      parameters:
      - description: Recommendation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Base'
            - properties:
                data:
                  $ref: '#/definitions/response.RecommendationReasonResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Get recommendation reason
      tags:
      - recommendations
  /transactions:
    get:
      consumes:
      - application/json
      description: Get a paginated list of transactions for the logged-in user
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Number of items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Base'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/response.TransactionResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Get transactions
      tags:
      - transactions
    post:
      consumes:
      - application/json
      description: Create a new transaction (transfer, payment, topup, withdraw, deposit,
        qris)
      parameters:
      - description: Create Transaction Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.CreateTransactionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Base'
            - properties:
                data:
                  $ref: '#/definitions/response.TransactionResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Create a new transaction
      tags:
      - transactions
  /transactions/{id}:
    get:
      consumes:
      - application/json
      description: Get details of a specific transaction by ID
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Base'
            - properties:
                data:
                  $ref: '#/definitions/response.TransactionResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Base'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Get transaction detail
      tags:
      - transactions
  /transactions/summary:
    get:
      consumes:
      - application/json
      description: Get a summary of user spending including total spend, favourite
        category, weekly comparisons, and top merchants
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Base'
            - properties:
                data:
                  $ref: '#/definitions/response.SpendingSummaryResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Base'
      security:
      - BearerAuth: []
      summary: Get spending summary
      tags:
      - transactions
  /users/me:
    delete:
      consumes:
      - application/json
      description: Soft deletes the currently logged in user account
      produces:
      - application/json
      responses:
        "200":
